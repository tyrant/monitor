# Add these two server blocks to /opt/nginx/conf/nginx.conf

server {
    listen 80;
    server_name monitor.mikeyclarke.co.nz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name monitor.mikeyclarke.co.nz;

    ssl_certificate     /etc/letsencrypt/live/monitor.mikeyclarke.co.nz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitor.mikeyclarke.co.nz/privkey.pem;

    auth_basic "Monitor";
    auth_basic_user_file /home/noob/monitor/.htpasswd;

    # API endpoint — no Basic Auth, uses X-API-Key header instead
    location /api/run {
        auth_basic off;
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
